name: security

# Supply-chain scanning, additive to ci.yml (lint/test/layering).
on:
  # Every branch, for the reason ci.yml gives: a contributor's first push should
  # say whether the supply-chain scan is clean, not only a maintainer's merge.
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # weekly: catch newly-disclosed CVEs in already-pinned deps

permissions:
  contents: read
  # gitleaks-action enumerates the commits on a pull request to scan its range.
  # Without this it gets `403 Resource not accessible by integration` and the
  # job fails — which reads as "secret found" and is in fact "the scan never
  # ran". A secret scanner that cannot run is worse than a red one, because the
  # red one gets looked at.
  pull-requests: read

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install self editable, so --skip-editable audits only third-party deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[oidc,a2a]"
          pip install pip-audit
      - name: Audit third-party dependencies
        run: pip-audit --skip-editable --progress-spinner off

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # The BINARY, pinned, and not `gitleaks/gitleaks-action`.
      #
      # The action did not apply `GITLEAKS_CONFIG`, so it scanned with its own
      # defaults and failed on `AKIA9F3C1D77B02E4419QZ`, a synthetic AWS-shaped
      # string this repository needs in order to TEST a secret detector. That
      # value is allowlisted by value in `.gitleaks.toml` and the same scan
      # passes locally, so the check was red on main while every developer saw
      # green. A security gate that cannot be reproduced on a laptop is a gate
      # that gets switched off.
      #
      # Running the binary directly makes CI byte-identical to
      # `gitleaks detect -c .gitleaks.toml`, which is the command in
      # CONTRIBUTING.md. The version is pinned so an upstream rule change
      # arrives as a deliberate bump and not as a red build one morning.
      #
      # `.gitleaks.toml` allowlists every finding BY VALUE with its reason, and
      # never by excluding a directory, so a real credential pasted into a test
      # still fails the build.
      - name: Scan for secrets
        env:
          VERSION: 8.30.1
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version
          gitleaks detect --no-banner --redact -c .gitleaks.toml \
            --report-format sarif --report-path gitleaks.sarif

      - name: Keep the report even when the scan failed
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gitleaks.sarif
          path: gitleaks.sarif
          if-no-files-found: ignore

  trivy-fs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Trivy filesystem scan (vulns + misconfig + secrets)
        # v-prefixed: the bare `0.28.0` tag this used to name does not exist in the
        # action's repo, so every scheduled run failed at 'unable to resolve action'
        # rather than on a finding, a security scan that was reliably red for a
        # reason unrelated to security.
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

