name: CI

on:
  # Every branch, not only the default one. Scoping this to `main` meant a
  # contributor pushing a branch got no signal until they opened a pull request,
  # and it meant a red 3.10 leg on main was the only place anything was reported.
  push:
  pull_request:
  # Lets the slow invariant job be triggered by hand without waiting for the cron.
  workflow_dispatch:
  schedule:
    # The invariant suite is ~14 minutes and does not belong on every push. It
    # runs nightly instead (see the `invariants` job), so a regression is caught
    # within a day rather than blocking the inner loop.
    - cron: "0 5 * * *"

# The fast gate: everything that must be green before a change lands.
jobs:
  test:
    runs-on: ${{ matrix.os }}
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        # EVERY version `requires-python` admits, not just its ends. The
        # 3.10-and-3.11 SyntaxError below is the argument for the floor; the
        # argument for the middle is that the badge and the metadata claim
        # 3.10 to 3.14 and a claim nothing runs is a claim nobody checked.
        #
        # A backslash inside an f-string expression is a SyntaxError before
        # 3.12 and shipped undetected in `value_budget.py`, which
        # `clayseal/capabilities/__init__.py` imports, so the package was
        # unimportable on 3.10 and 3.11 while every local interpreter was 3.13.
        # 3.14 is tested because the distribution now admits it. The old
        # <3.14 ceiling came from an optional extra, not the library.
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          # macOS on one version rather than the full matrix. The syscall tier's
          # reference backend is macOS-only by construction, since
          # Hypervisor.framework allows one VM per process, so ubuntu-only CI
          # never built or imported anything on the platform that tier targets.
          # One job is enough to catch a path, a permission or a default that
          # differs; a second interpreter there buys nothing this does not.
          - os: macos-latest
            python-version: "3.13"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      # One install, from a clean index. `clayseal.core` is vendored in this
      # repo, so there is no sibling checkout and no PAT. The optional identity
      # layer is a separate distribution; the tests that want it skip via
      # importorskip when it is absent, which is what "optional" has to mean for
      # anyone who clones this repo.
      - name: Install
        run: pip install -e ".[dev,redis]"
      # The layering contract is now `python/tests/test_shipped_package_layering.py`
      # rather than a CLI step. The step this replaces invoked
      # `python -m clayseal.core.layering`, a module that does not exist in
      # clayseal core at all, a dead reference from the repo split that only
      # surfaced when CI ran for the first time. The test is also stronger: it
      # reads the AST, so a LAZY import inside a function is distinguished from a
      # module-scope one, which is exactly the distinction an optional extra
      # turns on.
      - name: Run tests
        run: pytest python/tests -q

      # `demo/` is the first thing a new reader runs, and its 39 tests were in no
      # gate at all. They take twelve seconds. The demo's pure modules must also
      # import with `rich` absent, which installing only [dev] is what enforces,
      # so running them here rather than under [demo] is deliberate.
      - name: Run the demo tests
        run: pytest demo/tests -q

  # The wheel has to work as a wheel. `deployable_stack.py` imported
  # `benchmarks.core.detector_eval` from inside a method, fine in the checkout,
  # ModuleNotFoundError in every real install, and invisible to the layering step
  # above, which only knows about sibling clayseal packages. Build the artifact,
  # install it into a clean environment with NO source tree on the path, and
  # import every shipped module.
  wheel:
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - name: Build the wheel
        run: |
          pip install build
          python -m build --wheel --outdir dist/ .
      - name: Install it somewhere the source tree is not
        run: |
          mkdir -p /tmp/clean && cd /tmp/clean
          pip install "$GITHUB_WORKSPACE"/dist/*.whl
      # `clayseal try` is the first command in the README and the first thing a
      # new user runs. It has to work from the installed wheel with no source
      # tree in sight, which is the one place the checkout cannot tell you. It
      # exits non-zero if the gateway failed to stop what the tour says it
      # stops, so this is a smoke test of the product and not of the printing.
      - name: The first command in the README must work from the wheel
        working-directory: /tmp/clean
        run: clayseal try --fast

      - name: Import every shipped module from the installed wheel
        working-directory: /tmp/clean
        run: |
          python - <<'PY'
          import importlib, pkgutil, sys
          import clayseal.capabilities, clayseal.core
          failed = []
          mods = []
          for pkg in (clayseal.core, clayseal.capabilities):
              mods += list(pkgutil.walk_packages(pkg.__path__, pkg.__name__ + "."))
          for mod in mods:
              try:
                  importlib.import_module(mod.name)
              except ImportError as exc:
                  # Optional extras are legitimately absent in this environment.
                  if any(x in str(exc) for x in ("torch", "jwt", "spiffe", "redis",
                                                 "boto3", "rfc8785", "httpx",
                                                 "agentauth.identity")):
                      continue
                  failed.append((mod.name, exc))
              except Exception as exc:
                  failed.append((mod.name, exc))
          for name, exc in failed:
              print(f"FAIL {name}: {type(exc).__name__}: {exc}", file=sys.stderr)
          sys.exit(1 if failed else 0)
          PY

  lint:
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install ruff
      # The whole repository, not just the shipped package.
      #
      # This used to be `ruff check clayseal`, on the reasoning that the
      # benchmark tree is not on the deployment path. That was defensible for
      # `benchmarks/`, and it also left `python/tests/` ungated, which is the
      # test suite for the library itself. `ruff check .` is the first command a
      # contributor runs, and a repository where it fails teaches them that lint
      # output is noise.
      #
      # The exemptions live in `[tool.ruff.lint.per-file-ignores]` with a reason
      # written against each one. The correctness families are exempted nowhere.
      - name: Lint everything
        run: ruff check .

  # Types, as a ratchet rather than a wall.
  #
  # 93% of the library's functions carry annotations and nothing checked them,
  # so they were decoration. Turning mypy on as a hard failure would block every
  # change behind 94 untriaged findings; leaving it off let a hand-written count
  # in pyproject.toml drift from 92 to 98 unnoticed. The ratchet is the same
  # mechanism `check_claims` uses for measurement debt: the count may fall and
  # may not rise, per file as well as in total.
  types:
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install
        run: pip install -e ".[dev]" mypy
      - name: Type findings have not grown
        run: python scripts/mypy_ratchet.py

  # Performance as a PROPERTY, not a stopwatch.
  #
  # A wall-clock threshold on a shared runner is a flaky test that gets muted,
  # and a muted gate is worse than none. What this asserts instead are the two
  # things that must hold on any machine, both of which are invariants rather
  # than measurements:
  #
  #   * per-call cost does not grow with session length. A session-scoped
  #     gateway is always one mistake away from an O(N) term on the decision
  #     path, and this repository has already shipped that once: 13.1 s for
  #     2,000 actions before it was found.
  #   * memory retained per decision stays under a ceiling, so a new unbounded
  #     structure on the hot path fails here rather than in someone's long-lived
  #     deployment.
  #
  # The adversarial-argument budget lives in the test suite
  # (test_no_catastrophic_backtracking.py, BUDGET_MS) and runs in the fast gate.
  perf:
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Cost properties hold
        run: python -m benchmarks.gateway_cost --check

  # The slow gate: ladder monotonicity, confidentiality flow windows, gate
  # totality, commit-token mutation stress, replay defense, corpus adequacy.
  # These guard against a number being reported that the system did not earn.
  # ~14 minutes, so nightly and on demand rather than per push.
  invariants:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install
        run: pip install -e ".[dev,redis]"
      # Needs the fetched corpora, so it skips cleanly when they are absent
      # rather than failing the build.
      - name: Fetch benchmark corpora
        run: benchmarks/fetch_corpora.sh || echo "corpora unavailable; suites will skip"
      - name: Run benchmark invariants
        run: pytest benchmarks/tests -q

      # Also re-run the library suite WITH the corpora present. Tests marked
      # `requires_corpus` skip in the fast gate: that is a deferral to here, not
      # a hole, and this is the step that makes it one.
      - name: Run the library suite against the fetched corpora
        run: pytest python/tests -q

      # The runnable half of SEND_PACKET.md. Blocks on a forbidden claim, and
      # ratchets the bare-zero debt so it can shrink but not grow.
      - name: Check published claims
        run: python -m benchmarks.check_claims
