# Trivy secret-scanning config.
#
# One allow-rule, scoped to one file, for one reason.
#
# `benchmarks/adversarial/content_staging.py` defines SYNTHETIC_SECRET as an
# AWS-access-key-shaped string. Trivy flags it, and trivy is right to: it is
# exactly the shape of a real credential. That is the point. The value has to be
# recognised by the static secret classifiers in
# `agentauth/capabilities/hardening/object_class.py`, because the whole
# experiment is whether the confidentiality tracker notices a secret-shaped value
# read from a `.env` and staged into a README. A fixture the classifiers do not
# recognise would test nothing.
#
# The allow-rule is PATH-SCOPED rather than rule-scoped on purpose. Ignoring the
# `aws-access-key-id` rule globally would switch off AWS-key detection across a
# repository whose subject is preventing credential exfiltration, which is the
# wrong trade by a wide margin. This way a real key committed anywhere else still
# fails the build.
allow-rules:
  - id: benchmark-fixture-synthetic-secret
    description: >-
      Deliberately AWS-shaped synthetic value used as the staging payload in the
      adaptive in-scope-exfiltration benchmark. Not a credential; corresponds to
      no account. See the module docstring.
    paths:
      - benchmarks/adversarial/content_staging\.py$
