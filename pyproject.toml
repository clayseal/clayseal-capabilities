[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentauth-capabilities"
version = "0.5.0"
description = "Clay Seal layer 2 — dynamic capability tokens, leases, commit tokens, mandates"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10,<3.14"
dependencies = [
  "agentauth-core>=0.5,<0.6",
  "cryptography>=42.0",
  "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/pberlizov/clay-seal-capabilities"
Documentation = "https://github.com/pberlizov/clay-seal-capabilities/blob/main/docs/DEV_GUIDE.md"
Repository = "https://github.com/pberlizov/clay-seal-capabilities"
Issues = "https://github.com/pberlizov/clay-seal-capabilities/issues"
Changelog = "https://github.com/pberlizov/clay-seal-capabilities/blob/main/CHANGELOG.md"

# Execution-sandbox backends, resolved by name via agentauth.core.plugins. The
# built-in iVisor backend needs no dependency here (it drives an external
# binary); registering it makes the substrate swappable — a Linux deployment can
# ship a gVisor/seccomp backend under the same Protocol without touching callers.
[project.entry-points."agentauth.sandbox_backends"]
ivisor = "agentauth.capabilities.sandbox.backend:IVisorBackend"

[project.optional-dependencies]
# The live TUI in demo/. Deliberately NOT folded into [dev]: the demo's pure
# modules (reducer, escalation ladder, scenario) must import and test with rich
# absent, and CI installing [dev] only is what enforces that.
# openai is only needed by --provider openai/live; the mock provider
# needs neither a key nor a model.
demo = ["rich>=13.7", "openai>=1.40"]
# The default Biscuit token backend wraps the identity layer's primitives;
# identity is otherwise NOT required to use this layer (bring your own
# CapabilityTokenBackend via the agentauth.capability_backends entry point).
biscuit-service = ["agentauth-identity>=0.5,<0.6"]
# Verifying identity adapters (VerifyingOidcProvider, EntraAgentIdProvider):
# live JWT verification against OIDC discovery/JWKS.
oidc = ["PyJWT>=2.8,<3.0", "httpx>=0.27"]
# SPIFFE Workload API live-fetch (SpiffeWorkloadProvider): py-spiffe + grpcio.
spiffe = ["spiffe>=0.3"]
# A2A signed AgentCard verification (A2AAgentCardProvider): JWS over RFC 8785 JCS.
a2a = ["rfc8785>=0.1.4", "PyJWT>=2.8,<3.0"]
redis = ["redis>=5.0"]
dynamodb = ["boto3>=1.34"]
# External agent-security corpora for the enforcement benchmark (benchmarks/).
# agentdojo bundles its suite data; the loader tracks the 0.1.x suite/
# ground-truth API (get_suites -> load_and_inject_default_environment ->
# task.ground_truth). agentdojo supports Python 3.10-3.12, so run the benchmark
# under a 3.12 interpreter. InjecAgent/ToolEmu are separate checkouts (see
# benchmarks/README.md), not pip deps.
benchmarks = ["agentdojo>=0.1.35,<0.2"]
# Learned goal-conditioned trajectory scorer (agentauth.capabilities.monitor).
# Optional: the n-gram scorer + conformal layer run with no extra deps; torch is
# only needed to train/serve the transformer scorer (do it on a GPU VM).
monitor = ["torch>=2.2"]
dev = ["pytest>=8.0", "ruff>=0.4", "agentauth-capabilities[biscuit-service,oidc,a2a]"]

# Ship ONLY the capabilities subpackage in the shared `agentauth` namespace.
# `agentauth.core` comes from the agentauth-core wheel.
[tool.hatch.build.targets.wheel]
only-include = ["agentauth/capabilities"]

# Lint rules are PINNED rather than inherited from ruff's defaults, because
# `ruff check agentauth` is now a CI gate and an implicit rule set makes that
# gate change meaning whenever ruff releases. The families below are the ones
# already firing on this tree plus the correctness core.
[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
# Correctness and security rules only. Style opinions (SIM, PERF, line width,
# comprehension preference) are deliberately NOT gated: this tree's comments and
# docstrings carry the measurement record, and a linter that reflows them costs
# more than it returns.
select = [
  "E7", "E9",        # pycodestyle: the errors, not the whitespace opinions
  "F",               # pyflakes — undefined names, unused imports, dead locals
  "I",               # import order
  "UP",              # pyupgrade
  "B",               # bugbear — mutable defaults, bare raise, zip strictness
  "C4",              # comprehensions
  "PLE",             # pylint errors, incl. Trojan-Source character checks
  "PLW1510",         # subprocess.run without an explicit check=
  "PLR0402",
  "FURB",
  "TRY004",
  "BLE",             # blind except — a security gate must not silently swallow
  "S",               # bandit
  "RUF",
]
ignore = [
  # Line length is checked by eye here: the module docstrings deliberately carry
  # long prose and measurement tables that reflowing would make less readable.
  "E501",
  # `assert` is how the test suite works and how invariants are stated.
  "S101",
  # Subprocess use is the point of the sandbox driver, and its arguments are
  # built from validated policy rather than from user strings.
  "S603", "S607",
  # Typography is deliberate throughout: em-dashes, arrows and × in prose. These
  # rules exist to catch homoglyph attacks in identifiers, which `S` and the
  # `PLE` Trojan-Source checks already cover in the places that matter.
  "RUF001", "RUF002", "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# S105 is a NAME heuristic: it flags any constant whose identifier contains
# TOKEN or SECRET. In these three files the flagged values are a schema id and a
# set of environment-variable NAMES — the things you read a credential from, not
# a credential. Suppressed per file rather than globally so a genuine hardcoded
# secret elsewhere in the package still fails the build.
"agentauth/capabilities/commit.py" = ["S105"]
"agentauth/capabilities/used_token_store.py" = ["S105"]
"agentauth/capabilities/hardening/object_class.py" = ["S105"]
# This module DETECTS Trojan-Source bidi overrides, zero-width joiners and tag
# characters, so its pattern tables necessarily contain them. Flagging the
# detector for holding the thing it detects is the lint equivalent of an
# antivirus quarantining its own signature file.
"agentauth/capabilities/hardening/input_hardening.py" = ["PLE2502", "PLE2515", "RUF001", "RUF003"]

[tool.pytest.ini_options]
testpaths = ["python/tests"]
pythonpath = ["."]
