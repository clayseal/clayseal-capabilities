[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentauth-capabilities"
version = "0.4.0"
description = "AgentAuth layer 2 — dynamic capability tokens, leases, commit tokens, mandates"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10,<3.14"
dependencies = [
  "agentauth-identity @ git+https://github.com/pberlizov/agentauth-identity.git@v0.4.0",
  "cryptography>=42.0",
  "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/pberlizov/agentauth-capabilities"
Documentation = "https://github.com/pberlizov/agentauth-capabilities/blob/main/docs/DEV_GUIDE.md"
Repository = "https://github.com/pberlizov/agentauth-capabilities"
Issues = "https://github.com/pberlizov/agentauth-capabilities/issues"
Changelog = "https://github.com/pberlizov/agentauth-capabilities/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["agentauth"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["python/tests"]
pythonpath = ["."]
