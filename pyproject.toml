[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentauth-capabilities"
version = "0.5.0"
description = "AgentAuth layer 2 — dynamic capability tokens, leases, commit tokens, mandates"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10,<3.14"
dependencies = [
  "agentauth-core>=0.5,<0.6",
  "cryptography>=42.0",
  "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/pberlizov/agentauth-capabilities"
Documentation = "https://github.com/pberlizov/agentauth-capabilities/blob/main/docs/DEV_GUIDE.md"
Repository = "https://github.com/pberlizov/agentauth-capabilities"
Issues = "https://github.com/pberlizov/agentauth-capabilities/issues"
Changelog = "https://github.com/pberlizov/agentauth-capabilities/blob/main/CHANGELOG.md"

[project.optional-dependencies]
# The default Biscuit token backend wraps the identity layer's primitives;
# identity is otherwise NOT required to use this layer (bring your own
# CapabilityTokenBackend via the agentauth.capability_backends entry point).
biscuit-service = ["agentauth-identity>=0.5,<0.6"]
dev = ["pytest>=8.0", "ruff>=0.4", "agentauth-capabilities[biscuit-service]"]

# Ship ONLY the capabilities subpackage in the shared `agentauth` namespace.
# `agentauth.core` comes from the agentauth-core wheel.
[tool.hatch.build.targets.wheel]
only-include = ["agentauth/capabilities"]

[tool.pytest.ini_options]
testpaths = ["python/tests"]
pythonpath = ["."]
